<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DD Pay</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">
<div class="bg-zinc-900 p-6 rounded-2xl w-full max-w-md">
<h1 class="text-2xl font-bold mb-4 text-center">🔥 DD Pay Form</h1>
<form id="ddForm" class="space-y-4">
<input name="Name" placeholder="Name" required class="w-full p-3 rounded bg-zinc-800">
<input name="Phone" placeholder="Phone" required class="w-full p-3 rounded bg-zinc-800">
<input name="UPI" placeholder="UPI" required class="w-full p-3 rounded bg-zinc-800">
<input name="Amount" placeholder="Amount" required class="w-full p-3 rounded bg-zinc-800">
<button id="btn" class="w-full bg-white text-black p-3 rounded font-bold">Submit</button>
</form>
<p id="msg" class="text-center mt-3"></p>
</div>
<script>
document.getElementById('ddForm').addEventListener('submit', async(e)=>{
e.preventDefault();
const btn=document.getElementById('btn');
btn.textContent='Sending...';
let t=`🔥 DD Pay - Nayi Entry!\n\n`;
const fd=new FormData(e.target);
for(let [k,v] of fd.entries()) t+=`${k}: ${v}\n`;
await fetch('https://api.telegram.org/bot8606684305:AAF5P-iR60pafefJwJ187neRGBhHsUWbuqs/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:'7344589159',text:t})});
document.getElementById('msg').textContent='✅ Telegram pe bhej diya!';
e.target.reset();btn.textContent='Submit';
});
</script>
</body>
</html>
